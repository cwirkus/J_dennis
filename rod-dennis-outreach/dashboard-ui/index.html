<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rod Dennis — Outreach Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #0f0f0f; color: #f0ede8; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

    /* Three-panel shell */
    #shell { display: flex; height: 100vh; }
    #sidebar { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid #1a1a1a; background: #0a0a0a; }
    #list-panel { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid #1a1a1a; background: #0f0f0f; overflow: hidden; }
    #detail-panel { flex: 1; display: flex; flex-direction: column; background: #0f0f0f; overflow: hidden; }

    /* Sidebar nav */
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 20px; cursor: pointer; color: #555;
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      border-left: 2px solid transparent; user-select: none;
      position: relative;
    }
    .nav-item:hover { color: #888; }
    .nav-item.active { color: #f0ede8; border-left-color: #f0ede8; }
    .nav-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #e05555; flex-shrink: 0; }
    .nav-badge-count {
      font-size: 10px; padding: 1px 6px; border-radius: 10px;
      background: #2a2a2a; color: #888; letter-spacing: 0;
    }
    .nav-item.active .nav-badge-count { background: #333; color: #aaa; }

    /* List panel items */
    .list-item {
      padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #161616;
      position: relative;
    }
    .list-item:hover { background: #141414; }
    .list-item.selected { background: #1a1a1a; border-left: 2px solid #f0ede8; padding-left: 14px; }
    .list-item.hp-border { border-left: 2px solid #e05555; padding-left: 14px; }
    .list-item.hp-border.selected { border-left-color: #e05555; }

    /* Inputs */
    .field-label { font-size: 10px; letter-spacing: 0.1em; color: #444; text-transform: uppercase; margin-bottom: 4px; }
    .ifield {
      display: block; width: 100%;
      background: #111; border: 1px solid #222; border-radius: 3px;
      padding: 7px 10px; color: #f0ede8; font-size: 13px; font-family: inherit;
      outline: none;
    }
    .ifield:focus { border-color: #444; }
    textarea.ifield { resize: vertical; line-height: 1.65; }
    select.ifield { cursor: pointer; width: auto; }
    select.ifield option { background: #111; }

    /* Buttons */
    .btn {
      font-size: 10px; letter-spacing: 0.1em; padding: 6px 14px;
      border-radius: 3px; cursor: pointer; text-transform: uppercase;
      font-weight: 500; font-family: inherit; border: none;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-approve { background: #1e4a35; color: #7ecfaa; }
    .btn-approve:hover:not(:disabled) { background: #265e43; }
    .btn-save { background: #1a3558; border: 1px solid #2a4f7a; color: #7aaedd; }
    .btn-save:hover:not(:disabled) { background: #1f4070; }
    .btn-reject { background: #4a1a1a; color: #e08080; }
    .btn-reject:hover:not(:disabled) { background: #5e2020; }
    .btn-ghost { background: none; border: 1px solid #252525; color: #555; }
    .btn-ghost:hover:not(:disabled) { border-color: #383838; color: #888; }
    .btn-primary { background: #1e1e1e; border: 1px solid #333; color: #ccc; }
    .btn-primary:hover:not(:disabled) { background: #252525; border-color: #444; }

    /* Priority badges */
    .badge-p1 { font-size: 9px; padding: 1px 6px; border-radius: 2px; background: #3a2900; color: #c9920a; letter-spacing: 0.06em; }
    .badge-p2 { font-size: 9px; padding: 1px 6px; border-radius: 2px; background: #1e1e1e; color: #666; letter-spacing: 0.06em; }
    .badge-hp { font-size: 9px; padding: 1px 6px; border-radius: 2px; background: #3a1010; color: #e05555; letter-spacing: 0.06em; }
    .badge-channel { font-size: 9px; padding: 1px 6px; border-radius: 2px; background: #1a1a1a; color: #666; letter-spacing: 0.06em; }

    /* Approved copy-box */
    .approved-box { background: #0d1e14; border: 1px solid #2d5e43; border-radius: 4px; padding: 14px; margin-top: 12px; }
    .approved-box pre { font-size: 12px; color: #bbb; line-height: 1.65; white-space: pre-wrap; font-family: inherit; margin-top: 6px; padding: 10px; background: #0a0a0a; border-radius: 3px; border: 1px solid #1a1a1a; user-select: all; }

    /* Stat cards */
    .stat-card { background: #1a1a1a; border: 1px solid #222; border-radius: 6px; padding: 20px; }

    /* Section header in list */
    .list-section-header { padding: 8px 16px 6px; font-size: 9px; letter-spacing: 0.14em; color: #3a3a3a; text-transform: uppercase; background: #0c0c0c; border-bottom: 1px solid #161616; }

    /* Spinner */
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #333; border-top-color: #888; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toolbar strip at top of detail panel */
    #detail-toolbar { flex-shrink: 0; padding: 10px 20px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; gap: 12px; background: #0a0a0a; min-height: 46px; }
    #detail-body { flex: 1; overflow-y: auto; padding: 20px; }

    /* List panel header */
    #list-header { flex-shrink: 0; padding: 0 12px; border-bottom: 1px solid #1a1a1a; background: #0a0a0a; }
    #list-search { width: 100%; background: #0f0f0f; border: none; border-bottom: 1px solid #1a1a1a; padding: 10px 14px; color: #f0ede8; font-size: 12px; font-family: inherit; outline: none; }
    #list-search::placeholder { color: #333; }
    #list-body { flex: 1; overflow-y: auto; }
  </style>
</head>
<body>
<div id="shell">
  <!-- LEFT SIDEBAR -->
  <aside id="sidebar">
    <div style="padding: 20px 20px 16px; border-bottom: 1px solid #1a1a1a;">
      <div style="font-size: 10px; letter-spacing: 0.18em; color: #555; text-transform: uppercase;">Dashboard</div>
    </div>
    <nav id="sidebar-nav" style="flex: 1; padding: 8px 0;"></nav>
    <div style="padding: 16px 20px; border-top: 1px solid #1a1a1a;">
      <div style="font-size: 10px; letter-spacing: 0.12em; color: #333; text-transform: uppercase; line-height: 1.8;">
        J. Rodney Dennis<br>
        <span style="color: #2a2a2a; letter-spacing: 0.08em;">Art Market Outreach</span>
      </div>
    </div>
  </aside>

  <!-- MIDDLE LIST PANEL -->
  <div id="list-panel">
    <div id="list-header"></div>
    <div id="list-body"></div>
  </div>

  <!-- RIGHT DETAIL PANEL -->
  <div id="detail-panel">
    <div id="detail-toolbar"></div>
    <div id="detail-body"></div>
  </div>
</div>

<script>
// ── API ──────────────────────────────────────────────────────────────────────
const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:8000'
  : 'https://jdennis-production.up.railway.app';

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`${res.status}: ${t}`); }
  return res.json();
}

function esc(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(v) { return esc(v).replace(/"/g,'&quot;'); }

function countryFlag(c) {
  const m = {'USA':'🇺🇸','US':'🇺🇸','United States':'🇺🇸','UK':'🇬🇧','United Kingdom':'🇬🇧',
    'France':'🇫🇷','Germany':'🇩🇪','UAE':'🇦🇪','Italy':'🇮🇹','Netherlands':'🇳🇱',
    'Switzerland':'🇨🇭','South Africa':'🇿🇦','Nigeria':'🇳🇬','Brazil':'🇧🇷',
    'Canada':'🇨🇦','Japan':'🇯🇵','China':'🇨🇳','Australia':'🇦🇺','Spain':'🇪🇸',
    'Mexico':'🇲🇽','India':'🇮🇳','Belgium':'🇧🇪','Austria':'🇦🇹','Sweden':'🇸🇪'};
  return m[c] || '';
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ── STATE ────────────────────────────────────────────────────────────────────
let activeTab = 'outreach';

// Outreach
let pendingDrafts = [];
let allProspects = [];
let prospectsOffset = 0;
let prospectsHasMore = false;
let selectedDraftId = null;
let selectedProspectId = null; // Supabase ID from allProspects
let draftsSearch = '';
let prospectsSearch = '';
let batchFormOpen = false;
let draftsPendingCount = 0;

// Social
let socialDrafts = [];
let selectedSocialDraftId = null;
let socialNewPostMode = false;

// Inbox
let inboxMsgs = [];
let selectedInboxMsgId = null;
let inboxLogMode = false;
let inboxPendingCount = 0;

// Stats
let statsData = null;
let discoveryLog = [];

// ── SIDEBAR ──────────────────────────────────────────────────────────────────
function renderSidebar() {
  const nav = document.getElementById('sidebar-nav');
  const items = [
    { tab: 'outreach', icon: '✉', label: 'Outreach', badge: draftsPendingCount > 0 ? `<span class="nav-badge-count">${draftsPendingCount}</span>` : '' },
    { tab: 'social',   icon: '◈', label: 'Social',   badge: '' },
    { tab: 'inbox',    icon: '⌂', label: 'Inbox',    badge: inboxPendingCount > 0 ? '<span class="nav-badge-dot"></span>' : '' },
    { tab: 'stats',    icon: '◎', label: 'Stats',    badge: '' },
  ];
  nav.innerHTML = items.map(it => `
    <div class="nav-item ${activeTab === it.tab ? 'active' : ''}" onclick="switchTab('${it.tab}')">
      <span style="opacity:0.6;">${it.icon}</span>
      <span style="flex:1;">${it.label}</span>
      ${it.badge}
    </div>
  `).join('');
}

// ── TAB SWITCHING ────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  renderSidebar();
  document.getElementById('list-panel').style.display = tab === 'stats' ? 'none' : '';
  if (tab === 'outreach') loadOutreach();
  else if (tab === 'social') loadSocial();
  else if (tab === 'inbox') loadInbox();
  else if (tab === 'stats') loadStats();
}

// ═══════════════════════════════════════════════════════════════════════════
// OUTREACH TAB
// ═══════════════════════════════════════════════════════════════════════════
async function loadOutreach() {
  renderOutreachList('<div style="padding:20px;color:#444;">Loading…</div>');
  renderOutreachDetail();
  try {
    [pendingDrafts, allProspects] = await Promise.all([
      api('/api/v1/dashboard/pending-outreach'),
      api('/api/v1/dashboard/all-prospects?offset=0&limit=100'),
    ]);
    prospectsOffset = 100;
    prospectsHasMore = allProspects.length === 100;
    draftsPendingCount = pendingDrafts.length;
    renderSidebar();
  } catch (e) {
    renderOutreachList(`<div style="padding:20px;color:#e05555;">Error: ${esc(e.message)}</div>`);
    return;
  }
  renderOutreachList();
  renderOutreachDetail();
}

function renderOutreachList(override) {
  const header = document.getElementById('list-header');
  const body = document.getElementById('list-body');

  header.innerHTML = `
    <input id="drafts-search" class="ifield" style="background:#0a0a0a;border:none;border-bottom:1px solid #1a1a1a;border-radius:0;padding:10px 14px;font-size:12px;"
      placeholder="Search contacts…" value="${escAttr(draftsSearch)}" oninput="onDraftsSearch(this.value)" />
  `;

  if (override) { body.innerHTML = override; return; }

  const q = draftsSearch.toLowerCase();
  const filtered = pendingDrafts.filter(d =>
    !q || (d.prospect_name || '').toLowerCase().includes(q) || (d.organization || '').toLowerCase().includes(q)
  );

  const filteredProspects = allProspects.filter(p =>
    !prospectsSearch && (!q || (p.name || '').toLowerCase().includes(q) || (p.organization || '').toLowerCase().includes(q))
  );

  let html = '';

  if (filtered.length) {
    html += `<div class="list-section-header">Pending Drafts (${filtered.length})</div>`;
    html += filtered.map(d => {
      const sel = selectedDraftId === d.id;
      const flag = countryFlag(d.country);
      const pri = d.priority == 1 ? '<span class="badge-p1">P1</span>' : '<span class="badge-p2">P2</span>';
      return `
        <div class="list-item ${sel ? 'selected' : ''}" onclick="selectDraft('${escAttr(d.id)}')">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
            <span style="font-weight:600;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(d.prospect_name || '—')}</span>
            ${pri}
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="color:#555;font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(d.organization || '')}</span>
            ${flag ? `<span style="font-size:13px;">${flag}</span>` : ''}
          </div>
        </div>
      `;
    }).join('');
  } else {
    html += `<div class="list-section-header">Pending Drafts</div>
      <div style="padding:14px 16px;color:#333;font-size:12px;">No pending drafts</div>`;
  }

  html += `
    <div class="list-section-header" style="margin-top:4px;">
      All Prospects
      <input id="prospects-search-input" style="background:transparent;border:none;border-bottom:1px solid #2a2a2a;color:#888;font-size:10px;font-family:inherit;outline:none;padding:1px 4px;margin-left:8px;width:100px;"
        placeholder="filter…" value="${escAttr(prospectsSearch)}" oninput="onProspectsSearch(this.value)" />
    </div>
  `;

  const pq = prospectsSearch.toLowerCase();
  const shownProspects = allProspects.filter(p =>
    !pq || (p.name || '').toLowerCase().includes(pq) || (p.organization || '').toLowerCase().includes(pq)
  );

  html += shownProspects.map(p => {
    const sel = selectedProspectId === p.id && !selectedDraftId;
    const flag = countryFlag(p.country);
    const pri = p.priority == 1 ? '<span class="badge-p1">P1</span>' : '<span class="badge-p2">P2</span>';
    return `
      <div class="list-item ${sel ? 'selected' : ''}" onclick="selectProspect('${escAttr(p.id)}')">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
          <span style="font-weight:600;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(p.name || '—')}</span>
          ${pri}
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="color:#555;font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(p.organization || '')}</span>
          ${flag ? `<span style="font-size:13px;">${flag}</span>` : ''}
        </div>
      </div>
    `;
  }).join('');

  if (prospectsHasMore && !pq) {
    html += `<div style="padding:12px 16px;">
      <button class="btn btn-ghost" onclick="loadMoreProspects()" style="width:100%;">Load more</button>
    </div>`;
  }

  body.innerHTML = html;
}

function onDraftsSearch(v) { draftsSearch = v; renderOutreachList(); }
function onProspectsSearch(v) { prospectsSearch = v; renderOutreachList(); }

async function loadMoreProspects() {
  try {
    const more = await api(`/api/v1/dashboard/all-prospects?offset=${prospectsOffset}&limit=100`);
    allProspects = allProspects.concat(more);
    prospectsOffset += 100;
    prospectsHasMore = more.length === 100;
    renderOutreachList();
  } catch (e) { alert('Load failed: ' + e.message); }
}

function selectDraft(id) {
  selectedDraftId = id;
  selectedProspectId = null;
  renderOutreachList();
  renderOutreachDetail();
}

function selectProspect(id) {
  selectedProspectId = id;
  selectedDraftId = null;
  renderOutreachList();
  renderOutreachDetail();
}

function renderOutreachDetail() {
  const toolbar = document.getElementById('detail-toolbar');
  const body = document.getElementById('detail-body');

  // Toolbar always shows batch form
  toolbar.innerHTML = `
    <button class="btn btn-primary" onclick="toggleBatchForm()">Generate Batch</button>
    <span style="color:#333;font-size:10px;letter-spacing:0.1em;">${draftsPendingCount} draft${draftsPendingCount !== 1 ? 's' : ''} pending</span>
    <div id="batch-form" style="display:${batchFormOpen ? 'flex' : 'none'};align-items:center;gap:10px;margin-left:8px;">
      <select id="batch-priority" class="ifield" style="font-size:10px;padding:4px 8px;">
        <option value="1">Priority 1</option><option value="2">Priority 2</option>
      </select>
      <select id="batch-country" class="ifield" style="font-size:10px;padding:4px 8px;">
        <option value="">All Countries</option>
        <option>USA</option><option>UK</option><option>France</option><option>Germany</option>
        <option>UAE</option><option>Italy</option><option>Netherlands</option>
        <option>South Africa</option><option>Nigeria</option><option>Canada</option>
      </select>
      <select id="batch-limit" class="ifield" style="font-size:10px;padding:4px 8px;">
        <option value="5">5</option><option value="10" selected>10</option>
        <option value="25">25</option><option value="50">50</option><option value="100">100</option>
      </select>
      <button class="btn btn-approve" id="batch-run-btn" onclick="runBatch()">Run</button>
      <span id="batch-status" style="font-size:11px;color:#888;"></span>
    </div>
  `;

  if (selectedDraftId) {
    const d = pendingDrafts.find(x => x.id === selectedDraftId);
    if (!d) { body.innerHTML = ''; return; }
    renderDraftDetail(d, body);
  } else if (selectedProspectId) {
    const p = allProspects.find(x => x.id === selectedProspectId);
    if (!p) { body.innerHTML = ''; return; }
    renderProspectDetail(p, body);
  } else {
    body.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#2a2a2a;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;">
        Select a contact to view or draft an outreach email
      </div>`;
  }
}

function toggleBatchForm() { batchFormOpen = !batchFormOpen; renderOutreachDetail(); }

async function runBatch() {
  const btn = document.getElementById('batch-run-btn');
  const status = document.getElementById('batch-status');
  const priority = parseInt(document.getElementById('batch-priority').value);
  const country = document.getElementById('batch-country').value || null;
  const limit = parseInt(document.getElementById('batch-limit').value);
  btn.disabled = true; btn.textContent = '…';
  status.textContent = 'Generating…';
  try {
    const r = await api('/api/v1/dashboard/run-pipeline', { method: 'POST', body: JSON.stringify({ priority, country, limit }) });
    status.textContent = `${r.new_drafts} new draft${r.new_drafts !== 1 ? 's' : ''} created`;
    batchFormOpen = false;
    await loadOutreach();
  } catch (e) {
    status.style.color = '#e05555'; status.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Run';
  }
}

function renderDraftDetail(d, container) {
  const hasNotes = d.notes && d.notes.trim();
  container.innerHTML = `

    <div style="max-width:680px;">
      <div style="margin-bottom:16px;">
        <div style="font-weight:600;font-size:16px;">${esc(d.prospect_name || '—')}</div>
        <div style="color:#555;font-size:12px;margin-top:2px;">${esc(d.organization || '')} ${d.country ? `· ${countryFlag(d.country)} ${esc(d.country)}` : ''}</div>
        <div style="color:#444;font-size:11px;margin-top:3px;font-family:monospace;">${esc(d.email || '')}</div>
      </div>

      <div style="margin-bottom:10px;">
        <div class="field-label">Subject</div>
        <input id="dsubject-${d.id}" class="ifield" type="text" value="${escAttr(d.subject || '')}" />
      </div>

      <div style="margin-bottom:${hasNotes ? '10px' : '14px'};">
        <div class="field-label">Body</div>
        <textarea id="dbody-${d.id}" class="ifield" style="min-height:300px;overflow:hidden;">${esc(d.body || '')}</textarea>
      </div>

      ${hasNotes ? `
        <div style="margin-bottom:14px;">
          <button class="btn btn-ghost" id="dnotes-btn-${d.id}" onclick="toggleNotes('${d.id}')" style="font-size:9px;">▼ Research</button>
          <div id="dnotes-${d.id}" style="display:none;margin-top:8px;padding:10px 12px;background:#111;border:1px solid #1a1a1a;border-radius:3px;font-size:12px;color:#888;line-height:1.65;">${esc(d.notes)}</div>
        </div>
      ` : ''}

      <div id="dactions-${d.id}" style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-approve" id="dapprove-${d.id}" onclick="approveDraft('${d.id}')">Approve</button>
        <button class="btn btn-save" id="dsave-${d.id}" onclick="saveDraftEdit('${d.id}')">Edit &amp; Save</button>
        <button class="btn btn-reject" onclick="rejectDraft('${d.id}')">Reject</button>
        <button class="btn" onclick="toggleRewrite('${d.id}')" style="background:#2a1245;color:#9966cc;border:1px solid #4a2a6a;">Rewrite</button>
      </div>

      <div id="drewrite-panel-${d.id}" style="display:none;margin-top:12px;padding:14px;background:#110a1a;border:1px solid #2d1a45;border-radius:4px;">
        <div class="field-label" style="margin-bottom:6px;color:#7a5faa;">Add Rod's thoughts or direction for the rewrite (optional):</div>
        <textarea id="drewrite-notes-${d.id}" class="ifield" rows="3"
          placeholder="e.g. mention my Florence Academy training, reference their recent Basquiat acquisition, make it warmer, shorter, more direct..."
          style="font-size:12px;margin-bottom:10px;"></textarea>
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="btn" id="drewrite-btn-${d.id}" onclick="submitRewrite('${d.id}')"
            style="background:#4a1a7a;color:#c099f0;border:1px solid #6a3aaa;">Rewrite Now</button>
          <span id="drewrite-status-${d.id}" style="font-size:11px;color:#888;"></span>
        </div>
      </div>

      <div id="dapproved-${d.id}"></div>
    </div>
  `;
  const bodyTa = document.getElementById(`dbody-${d.id}`);
  if (bodyTa) {
    autoExpandTa(bodyTa);
    bodyTa.addEventListener('input', () => autoExpandTa(bodyTa));
  }
}

function autoExpandTa(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.max(300, ta.scrollHeight) + 'px';
}

function toggleRewrite(id) {
  const panel = document.getElementById('drewrite-panel-' + id);
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

async function submitRewrite(id) {
  const notesEl = document.getElementById(`drewrite-notes-${id}`);
  const notes = notesEl ? notesEl.value : '';
  const btn = document.getElementById(`drewrite-btn-${id}`);
  const status = document.getElementById(`drewrite-status-${id}`);
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Rewriting…';
  status.textContent = '';
  status.style.color = '#888';
  try {
    const result = await api('/api/v1/dashboard/rewrite-draft', {
      method: 'POST',
      body: JSON.stringify({ draft_id: id, notes }),
    });
    const subjectEl = document.getElementById(`dsubject-${id}`);
    const bodyEl = document.getElementById(`dbody-${id}`);
    if (subjectEl) subjectEl.value = result.subject;
    if (bodyEl) { bodyEl.value = result.body; autoExpandTa(bodyEl); }
    const draft = pendingDrafts.find(d => d.id === id);
    if (draft) { draft.subject = result.subject; draft.body = result.body; }
    btn.disabled = false;
    btn.textContent = 'Rewritten ✓';
    btn.style.background = '#1e4a35';
    btn.style.color = '#7ecfaa';
    btn.style.borderColor = '#2d6e4f';
    setTimeout(() => {
      btn.textContent = 'Rewrite Now';
      btn.style.background = '#4a1a7a';
      btn.style.color = '#c099f0';
      btn.style.borderColor = '#6a3aaa';
      const panel = document.getElementById('drewrite-panel-' + id);
      if (panel) panel.style.display = 'none';
    }, 2000);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Rewrite Now';
    status.style.color = '#e05555';
    status.textContent = 'Error: ' + e.message;
  }
}

function toggleNotes(id) {
  const el = document.getElementById('dnotes-' + id);
  const btn = document.getElementById('dnotes-btn-' + id);
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  btn.textContent = open ? '▼ Research' : '▲ Research';
}

async function approveDraft(id) {
  const btn = document.getElementById('dapprove-' + id);
  btn.disabled = true; btn.textContent = '…';
  try {
    const result = await api(`/api/v1/dashboard/approve-outreach/${id}`, { method: 'POST' });
    document.getElementById('dactions-' + id).style.display = 'none';
    document.getElementById(`dsubject-${id}`).disabled = true;
    document.getElementById(`dbody-${id}`).disabled = true;
    const subject = document.getElementById(`dsubject-${id}`).value;
    const body = document.getElementById(`dbody-${id}`).value;
    document.getElementById('dapproved-' + id).innerHTML = `
      <div class="approved-box">
        <div style="color:#6fcf97;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px;">✓ Approved — copy subject and body below, then send from Gmail</div>
        <div style="margin-bottom:8px;"><div class="field-label">To</div><div style="font-family:monospace;color:#6fcf97;padding:4px 0;user-select:all;">${esc(result.prospect_email)}</div></div>
        <div style="margin-bottom:8px;"><div class="field-label">Subject</div><div style="padding:4px 0;user-select:all;">${esc(subject)}</div></div>
        <div><div class="field-label">Body</div><pre>${esc(body)}</pre></div>
      </div>`;
    pendingDrafts = pendingDrafts.filter(d => d.id !== id);

    renderSidebar();

  } catch (e) { btn.disabled = false; btn.textContent = 'Approve'; alert('Approve failed: ' + e.message); }
}

async function saveDraftEdit(id) {
  const subject = document.getElementById(`dsubject-${id}`).value;
  const body = document.getElementById(`dbody-${id}`).value;
  const btn = document.getElementById('dsave-' + id);
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await api(`/api/v1/dashboard/edit-outreach/${id}`, { method: 'PATCH', body: JSON.stringify({ subject, body }) });
    btn.textContent = 'Saved ✓';
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Edit & Save'; }, 1800);
  } catch (e) { btn.disabled = false; btn.textContent = 'Edit & Save'; alert('Save failed: ' + e.message); }
}

async function rejectDraft(id) {
  if (!confirm('Reject this draft?')) return;
  try {
    await api(`/api/v1/dashboard/reject-outreach/${id}`, { method: 'POST' });
    pendingDrafts = pendingDrafts.filter(d => d.id !== id);
    draftsPendingCount = pendingDrafts.length;
    selectedDraftId = null;
    renderSidebar();

  } catch (e) { alert('Reject failed: ' + e.message); }
}

async function draftForProspect(id) {
  const btn = document.getElementById(`draft-prospect-btn-${id}`);
  const status = document.getElementById(`draft-prospect-status-${id}`);
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Generating…';
  status.textContent = 'Researching and writing draft — this takes ~20 seconds…';
  try {
    const draft = await api('/api/v1/dashboard/draft-for-prospect', { method: 'POST', body: JSON.stringify({ prospect_id: id }) });
    // Add to pendingDrafts if not already there
    if (!pendingDrafts.find(d => d.id === draft.id)) {
      pendingDrafts.unshift(draft);
      draftsPendingCount = pendingDrafts.length;
    }
    selectedDraftId = draft.id;
    selectedProspectId = null;
    renderSidebar();
    renderOutreachList();
    renderOutreachDetail();

    btn.disabled = false; btn.textContent = 'Draft Email for This Person';

  }
}

async function loadSocial() {
  renderSocialList('<div style="padding:20px;color:#444;">Loading…</div>');
  renderSocialDetail();
  try {
    socialDrafts = await api('/api/v1/social/pending');
  } catch (e) {
    renderSocialList(`<div style="padding:20px;color:#e05555;">Error: ${esc(e.message)}</div>`); return;
  }
  renderSocialList();
  renderSocialDetail();
}

function renderSocialList(override) {
  const header = document.getElementById('list-header');
  const body = document.getElementById('list-body');

  header.innerHTML = `
    <div style="padding:10px 14px;">
      <button class="btn btn-primary" onclick="openSocialNewPost()" style="width:100%;">+ New Post</button>
    </div>
  `;

  if (override) { body.innerHTML = override; return; }

  if (!socialDrafts.length) { body.innerHTML = '<div style="padding:20px;color:#333;font-size:12px;">No pending drafts.</div>'; return; }

  const groups = {};
  socialDrafts.forEach(d => {
    const k = d.trigger_event || 'Untitled';
    if (!groups[k]) groups[k] = [];
    groups[k].push(d);
  });

  const platLabel = { linkedin: 'LI', twitter: 'TW', instagram: 'IG' };
  const platColor = { linkedin: '#1a2a4a', twitter: '#1a3a45', instagram: '#4a1a3a' };

  body.innerHTML = Object.entries(groups).map(([trigger, items]) => {
    const sorted = items.slice().sort((a, b) => ['linkedin','twitter','instagram'].indexOf(a.platform) - ['linkedin','twitter','instagram'].indexOf(b.platform));
    return `
      <div class="list-section-header">${esc(trigger)}</div>
      ${sorted.map(d => {
        const sel = selectedSocialDraftId === d.id;
        const plat = platLabel[d.platform] || d.platform.toUpperCase();
        const bg = platColor[d.platform] || '#1a1a1a';
        return `
          <div class="list-item ${sel ? 'selected' : ''}" onclick="selectSocialDraft('${escAttr(d.id)}')">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;">
              <span style="font-size:9px;padding:1px 5px;border-radius:2px;background:${bg};color:#aaa;letter-spacing:0.06em;">${plat}</span>
              <span style="color:#555;font-size:10px;">${fmtDate(d.created_at)}</span>
            </div>
            <div style="color:#888;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc((d.content || '').slice(0, 60))}</div>
          </div>
        `;
      }).join('')}
    `;
  }).join('');
}

function selectSocialDraft(id) {
  selectedSocialDraftId = id;
  socialNewPostMode = false;
  renderSocialList();
  renderSocialDetail();
}

function openSocialNewPost() {
  socialNewPostMode = true;
  selectedSocialDraftId = null;
  renderSocialList();
  renderSocialDetail();
}

function renderSocialDetail() {
  const toolbar = document.getElementById('detail-toolbar');
  const body = document.getElementById('detail-body');
  toolbar.innerHTML = '<span style="color:#333;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;">Social</span>';

  if (socialNewPostMode) {
    body.innerHTML = `
      <div style="max-width:580px;">
        <div style="margin-bottom:14px;font-size:10px;letter-spacing:0.12em;color:#555;text-transform:uppercase;">New Social Post</div>

          <input id="soc-trigger" class="ifield" type="text" placeholder="e.g. 2024 ARC Salon Chairman Choice Award" /></div>
        <div style="margin-bottom:12px;"><div class="field-label">Context (optional)</div>
          <textarea id="soc-context" class="ifield" rows="3" placeholder="e.g. just completed a 40×50 oil on linen…"></textarea></div>
        <div style="margin-bottom:16px;"><div class="field-label" style="margin-bottom:8px;">Platforms</div>
          <div style="display:flex;gap:18px;">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#888;"><input type="checkbox" id="sp-linkedin" checked style="accent-color:#aaa;" /> LinkedIn</label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#888;"><input type="checkbox" id="sp-twitter" checked style="accent-color:#aaa;" /> Twitter</label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#888;"><input type="checkbox" id="sp-instagram" checked style="accent-color:#aaa;" /> Instagram</label>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="btn btn-approve" id="soc-gen-btn" onclick="generateSocial()">Generate</button>
          <span id="soc-gen-status" style="font-size:12px;color:#888;"></span>
        </div>
        <div id="soc-generated"></div>
      </div>`;
    return;
  }

  if (!selectedSocialDraftId) {
    body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#2a2a2a;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;">Select a draft or create a new post</div>';
    return;
  }

  const d = socialDrafts.find(x => x.id === selectedSocialDraftId);
  if (!d) { body.innerHTML = ''; return; }

  const maxChars = d.platform === 'twitter' ? 280 : null;
  const platLabel = { linkedin: 'LinkedIn', twitter: 'Twitter / X', instagram: 'Instagram' };
  body.innerHTML = `
    <div style="max-width:580px;">
      <div style="margin-bottom:14px;display:flex;align-items:center;gap:10px;">
        <span style="font-size:10px;letter-spacing:0.12em;color:#888;text-transform:uppercase;">${esc(platLabel[d.platform] || d.platform)}</span>
        ${d.trigger_event ? `<span style="color:#333;font-size:11px;">${esc(d.trigger_event)}</span>` : ''}
      </div>
      <div style="margin-bottom:8px;">
        <textarea id="soc-text-${d.id}" rows="${d.platform === 'linkedin' ? 12 : 5}" oninput="onSocInput('${d.id}',${maxChars||'null'})"
          class="ifield">${esc(d.content || '')}</textarea>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <span id="soc-cc-${d.id}" style="font-size:11px;color:#555;">${(d.content||'').length}${maxChars ? ' / '+maxChars : ' chars'}</span>
      </div>
      <div id="soc-actions-${d.id}" style="display:flex;gap:8px;">
        <button class="btn btn-approve" onclick="approveSocial('${d.id}')">Approve</button>
        <button class="btn btn-save" onclick="saveSocial('${d.id}')">Edit &amp; Save</button>
        <button class="btn btn-reject" onclick="deleteSocial('${d.id}')">Delete</button>
      </div>
      <div id="soc-approved-${d.id}" style="display:none;margin-top:10px;font-size:11px;color:#6fcf97;letter-spacing:0.08em;">
        Approved — copy text above and post manually
      </div>
    </div>`;
}

function onSocInput(id, max) {
  const ta = document.getElementById(`soc-text-${id}`);
  const cc = document.getElementById(`soc-cc-${id}`);
  if (!ta || !cc) return;
  const n = ta.value.length;
  cc.textContent = max ? `${n} / ${max}` : `${n} chars`;
  cc.style.color = max && n > max ? '#e05555' : '#555';
}

async function generateSocial() {
  const trigger = document.getElementById('soc-trigger').value.trim();
  if (!trigger) { alert('Enter a trigger event.'); return; }
  const context = document.getElementById('soc-context').value.trim();
  const platforms = ['linkedin','twitter','instagram'].filter(p => document.getElementById('sp-'+p)?.checked);
  if (!platforms.length) { alert('Select at least one platform.'); return; }
  const btn = document.getElementById('soc-gen-btn');
  const status = document.getElementById('soc-gen-status');
  const genDiv = document.getElementById('soc-generated');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Generating…';
  status.textContent = 'Calling Claude — ~15 seconds…';
  genDiv.innerHTML = '';
  try {
    const data = await api('/api/v1/social/generate', { method: 'POST', body: JSON.stringify({ trigger_event: trigger, context, platforms }) });
    const drafts = data.drafts || [];
    status.textContent = `${drafts.length} draft${drafts.length !== 1 ? 's' : ''} generated`;
    socialDrafts = socialDrafts.concat(drafts);
    socialNewPostMode = false;
    selectedSocialDraftId = drafts[0]?.id || null;
    renderSocialList();
    renderSocialDetail();
  } catch (e) { status.style.color = '#e05555'; status.textContent = 'Error: ' + e.message; }
  finally { btn.disabled = false; btn.textContent = 'Generate'; }
}

async function approveSocial(id) {
  try {
    await api(`/api/v1/social/${id}/approve`, { method: 'PATCH' });
    document.getElementById('soc-actions-'+id).style.display = 'none';
    document.getElementById('soc-approved-'+id).style.display = 'block';
    const ta = document.getElementById('soc-text-'+id); if (ta) ta.disabled = true;
  } catch (e) { alert('Approve failed: ' + e.message); }
}

async function saveSocial(id) {
  const ta = document.getElementById('soc-text-'+id);
  if (!ta) return;
  try { await api(`/api/v1/social/${id}/edit`, { method: 'PATCH', body: JSON.stringify({ content: ta.value }) }); }
  catch (e) { alert('Save failed: ' + e.message); }
}

async function deleteSocial(id) {
  if (!confirm('Delete this draft?')) return;
  try {
    await api(`/api/v1/social/${id}`, { method: 'DELETE' });
    socialDrafts = socialDrafts.filter(d => d.id !== id);
    selectedSocialDraftId = null;
    renderSocialList();
    renderSocialDetail();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

        <div style="display:flex;gap:8px;align-items:center;">
          ${hp ? '<span class="badge-hp">High Priority</span>' : ''}
          <span class="badge-channel">${esc(m.channel || 'email')}</span>
          <span style="color:#333;font-size:11px;">${fmtDate(m.created_at)}</span>
        </div>
      </div>
      <div style="margin-bottom:14px;padding:12px 14px;background:#111;border:1px solid #1a1a1a;border-radius:3px;font-size:13px;color:#ccc;line-height:1.65;white-space:pre-wrap;">${esc(m.message || '')}</div>
      <div style="margin-bottom:10px;"><div class="field-label">AI Draft Response</div>
        <textarea id="im-resp-${m.id}" class="ifield" rows="8" style="margin-top:4px;">${esc(m.draft_response || '')}</textarea>
      </div>
      <div id="im-actions-${m.id}" style="display:flex;gap:8px;">
        <button class="btn btn-approve" onclick="approveInbox('${m.id}','${escAttr(m.sender_email||'')}')">Approve &amp; Copy</button>
        <button class="btn btn-save" onclick="saveInbox('${m.id}')">Edit &amp; Save</button>
        <button class="btn btn-reject" onclick="deleteInbox('${m.id}')">Delete</button>
      </div>
      <div id="im-approved-${m.id}" style="display:none;margin-top:10px;font-size:11px;color:#6fcf97;letter-spacing:0.08em;">
        Response approved and copied — send from Gmail to <span style="font-family:monospace;">${esc(m.sender_email || '')}</span>
      </div>
    </div>`;
}

async function approveInbox(id, email) {
  try {
    const r = await api(`/api/v1/chat/${id}/approve-response`, { method: 'POST' });
    await navigator.clipboard.writeText(r.draft_response || '').catch(() => {});
    document.getElementById('im-actions-'+id).style.display = 'none';
    document.getElementById('im-approved-'+id).style.display = 'block';
    const ta = document.getElementById('im-resp-'+id); if (ta) ta.disabled = true;
  } catch (e) { alert('Approve failed: ' + e.message); }
}

async function saveInbox(id) {
  const ta = document.getElementById('im-resp-'+id); if (!ta) return;
  try { await api(`/api/v1/chat/${id}/edit-response`, { method: 'PATCH', body: JSON.stringify({ draft_response: ta.value }) }); }
  catch (e) { alert('Save failed: ' + e.message); }
}

async function deleteInbox(id) {
  if (!confirm('Delete this message?')) return;
  try {
    await api(`/api/v1/chat/${id}`, { method: 'DELETE' });
    inboxMsgs = inboxMsgs.filter(m => m.id !== id);
    inboxPendingCount = inboxMsgs.length;
    selectedInboxMsgId = null;
    renderSidebar();
    renderInboxList();
    renderInboxDetail();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

async function submitInbound() {
  const name = document.getElementById('im-name').value.trim();
  const email = document.getElementById('im-email').value.trim();
  const channel = document.getElementById('im-channel').value;
  const message = document.getElementById('im-message').value.trim();
  if (!name || !email || !message) { alert('Name, email, and message are required.'); return; }
  const btn = document.getElementById('im-submit-btn');
  const status = document.getElementById('im-submit-status');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Generating…';
  status.textContent = 'Calling Claude for a draft response…';
  try {
    await api('/api/v1/chat/inbound', { method: 'POST', body: JSON.stringify({ sender_name: name, sender_email: email, channel, message }) });
    status.textContent = 'Done — message and draft added.';
    await loadInbox();
  } catch (e) { status.style.color = '#e05555'; status.textContent = 'Error: ' + e.message; }
  finally { btn.disabled = false; btn.textContent = 'Submit & Generate Draft'; }
}

// ═══════════════════════════════════════════════════════════════════════════
// STATS TAB
// ═══════════════════════════════════════════════════════════════════════════
async function loadStats() {
  const toolbar = document.getElementById('detail-toolbar');
  const body = document.getElementById('detail-body');
  toolbar.innerHTML = `
    <span style="color:#333;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;">Stats</span>
    <button class="btn btn-ghost" onclick="loadStats()" style="margin-left:auto;font-size:9px;">↻ Refresh</button>
  `;
  body.innerHTML = '<div style="padding:40px;color:#444;">Loading…</div>';
  try {
    [statsData, discoveryLog] = await Promise.all([
      api('/api/v1/dashboard/stats'),
      api('/api/v1/dashboard/discovery-log').catch(() => []),
    ]);
  } catch (e) { body.innerHTML = `<div style="padding:40px;color:#e05555;">Error: ${esc(e.message)}</div>`; return; }
  renderStats();
}

function renderStats() {
  const s = statsData || {};
  const log = discoveryLog || [];
  const body = document.getElementById('detail-body');

  const cards = [
    { label: 'Total Prospects',  value: s.total_prospects  ?? '—' },
    { label: 'Emails Available', value: s.emails_available ?? '—' },
    { label: 'Not Contacted',    value: s.not_contacted    ?? '—' },
    { label: 'Pending Drafts',   value: s.pending_drafts   ?? '—' },
    { label: 'Sent',             value: s.sent             ?? '—' },
    { label: 'Approved',         value: s.approved_drafts  ?? '—' },
  ];

  const logRows = log.length ? log.map((r, i) => `
    <tr style="${i < log.length-1 ? 'border-bottom:1px solid #1a1a1a;' : ''}">
      <td style="padding:8px 16px;color:#888;">${r.run_at ? new Date(r.run_at).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) : '—'}</td>
      <td style="padding:8px 16px;color:#888;">${esc(r.source || '—')}</td>
      <td style="padding:8px 16px;color:#c9920a;">${r.prospects_found ?? 0}</td>
      <td style="padding:8px 16px;color:#6fcf97;">${r.prospects_added ?? 0}</td>
    </tr>`).join('') : `<tr><td colspan="4" style="padding:16px;color:#333;">No runs yet.</td></tr>`;

  body.innerHTML = `
    <div style="max-width:820px;">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px;">
        ${cards.map(c => `
          <div class="stat-card">
            <div style="font-size:44px;font-weight:300;color:#c9920a;line-height:1;letter-spacing:-0.02em;">${c.value}</div>
            <div style="color:#444;font-size:10px;margin-top:8px;letter-spacing:0.1em;text-transform:uppercase;">${c.label}</div>
          </div>`).join('')}
      </div>

      <div style="background:#1a1a1a;border:1px solid #222;border-radius:6px;padding:18px;margin-bottom:20px;">
        <div style="font-size:10px;letter-spacing:0.12em;color:#555;text-transform:uppercase;margin-bottom:14px;">Generate More Drafts</div>
        <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
          <div><div class="field-label">Priority</div>
            <select id="stats-priority" class="ifield" style="font-size:11px;padding:5px 8px;">
              <option value="1">Priority 1</option><option value="2">Priority 2</option>
            </select></div>
          <div><div class="field-label">Country</div>
            <select id="stats-country" class="ifield" style="font-size:11px;padding:5px 8px;">
              <option value="">All</option><option>USA</option><option>UK</option><option>France</option>
              <option>Germany</option><option>UAE</option><option>South Africa</option><option>Nigeria</option>
            </select></div>
          <div><div class="field-label">Limit</div>
            <select id="stats-limit" class="ifield" style="font-size:11px;padding:5px 8px;">
              <option value="5">5</option><option value="10" selected>10</option>
              <option value="25">25</option><option value="50">50</option>
            </select></div>
          <button class="btn btn-approve" id="stats-pipeline-btn" onclick="runStatsPipeline()">Generate Drafts</button>
        </div>
        <div id="stats-pipeline-result" style="margin-top:10px;font-size:12px;color:#888;min-height:18px;"></div>
      </div>

      <div style="background:#1a1a1a;border:1px solid #222;border-radius:6px;padding:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <div style="font-size:10px;letter-spacing:0.12em;color:#555;text-transform:uppercase;">Discovery Agent</div>
          <button class="btn btn-save" id="discovery-btn" onclick="runDiscovery()">Run Now</button>
        </div>
        <div id="discovery-status" style="font-size:12px;color:#888;margin-bottom:12px;min-height:16px;"></div>
        <div id="discovery-results" style="display:none;margin-bottom:16px;"></div>
        <div style="font-size:10px;letter-spacing:0.1em;color:#444;text-transform:uppercase;margin-bottom:10px;">Last 10 Runs</div>
        <div style="background:#111;border:1px solid #1a1a1a;border-radius:4px;overflow:hidden;">
          <table style="width:100%;border-collapse:collapse;font-size:12px;">
            <thead><tr style="border-bottom:1px solid #1a1a1a;">
              <th style="padding:8px 16px;text-align:left;color:#444;font-weight:400;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;">Date</th>
              <th style="padding:8px 16px;text-align:left;color:#444;font-weight:400;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;">Source</th>
              <th style="padding:8px 16px;text-align:left;color:#444;font-weight:400;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;">Found</th>
              <th style="padding:8px 16px;text-align:left;color:#444;font-weight:400;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;">Added</th>
            </tr></thead>
            <tbody id="discovery-log-body">${logRows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
}

async function runStatsPipeline() {
  const btn = document.getElementById('stats-pipeline-btn');
  const result = document.getElementById('stats-pipeline-result');
  const priority = parseInt(document.getElementById('stats-priority').value);
  const country = document.getElementById('stats-country').value || null;
  const limit = parseInt(document.getElementById('stats-limit').value);
  btn.disabled = true; btn.textContent = 'Generating…';
  result.textContent = ''; result.style.color = '#888';
  try {
    const data = await api('/api/v1/dashboard/run-pipeline', { method: 'POST', body: JSON.stringify({ country, limit, priority }) });
    result.textContent = `${data.new_drafts} new draft${data.new_drafts !== 1 ? 's' : ''} generated — switch to Outreach tab to review`;
    result.style.color = '#6fcf97';
  } catch (e) { result.style.color = '#e05555'; result.textContent = 'Error: ' + e.message; }
  finally { btn.disabled = false; btn.textContent = 'Generate Drafts'; }
}

async function runDiscovery() {
  const btn = document.getElementById('discovery-btn');
  const status = document.getElementById('discovery-status');
  const results = document.getElementById('discovery-results');
  btn.disabled = true; btn.textContent = 'Searching…';
  status.textContent = 'Searching for new prospects…'; status.style.color = '#888';
  results.style.display = 'none'; results.innerHTML = '';
  try {
    const data = await api('/api/v1/dashboard/run-discovery', { method: 'POST' });
    status.textContent = `Found ${data.prospects_found} — ${data.prospects_added} new added.`;
    status.style.color = data.prospects_added > 0 ? '#6fcf97' : '#888';
    if (data.new_prospects?.length) {
      results.innerHTML = `<div style="padding:10px 14px;background:#111;border:1px solid #1a1a1a;border-radius:3px;margin-bottom:8px;">
        ${data.new_prospects.map(p => `<div style="padding:5px 0;border-bottom:1px solid #1a1a1a;font-size:12px;"><span style="color:#f0ede8;">${esc(p.name)}</span> <span style="color:#444;">·</span> <span style="color:#666;">${esc(p.organization)}</span></div>`).join('')}
      </div>`;
      results.style.display = 'block';
    }
    discoveryLog = await api('/api/v1/dashboard/discovery-log').catch(() => []);
    const tbody = document.getElementById('discovery-log-body');
    if (tbody) {
      tbody.innerHTML = discoveryLog.map((r, i) => `
        <tr style="${i < discoveryLog.length-1 ? 'border-bottom:1px solid #1a1a1a;' : ''}">
          <td style="padding:8px 16px;color:#888;">${r.run_at ? new Date(r.run_at).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) : '—'}</td>
          <td style="padding:8px 16px;color:#888;">${esc(r.source || '—')}</td>
          <td style="padding:8px 16px;color:#c9920a;">${r.prospects_found ?? 0}</td>
          <td style="padding:8px 16px;color:#6fcf97;">${r.prospects_added ?? 0}</td>
        </tr>`).join('');
    }
  } catch (e) { status.style.color = '#e05555'; status.textContent = 'Error: ' + e.message; }
  finally { btn.disabled = false; btn.textContent = 'Run Now'; }
}

// ── BADGE POLL ON BOOT ────────────────────────────────────────────────────────
async function checkBadges() {
  try {
    const msgs = await api('/api/v1/chat/pending');
    inboxPendingCount = msgs.length;
    renderSidebar();
  } catch (_) {}
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
renderSidebar();
switchTab('outreach');
checkBadges();
</script>
