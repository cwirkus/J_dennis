<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rod Dennis — Outreach Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0f0f0f; }
    body { color: #f0ede8; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }

    /* Tab buttons */
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #555;
      font-size: 11px;
      letter-spacing: 0.15em;
      padding: 10px 22px;
      cursor: pointer;
      margin-bottom: -1px;
      font-family: inherit;
      text-transform: uppercase;
    }
    .tab-btn.active { color: #f0ede8; border-bottom-color: #d4a847; }
    .tab-btn:hover:not(.active) { color: #888; }

    /* Cards */
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }

    /* Form fields */
    .field-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .input-field {
      display: block;
      width: 100%;
      background: #111;
      border: 1px solid #252525;
      border-radius: 4px;
      padding: 8px 11px;
      color: #f0ede8;
      font-size: 13px;
      font-family: inherit;
    }
    .input-field:focus { outline: none; border-color: #d4a847; }
    select.input-field { width: auto; cursor: pointer; }
    select.input-field option { background: #1a1a1a; }

    /* Buttons */
    .btn {
      font-size: 10px;
      letter-spacing: 0.12em;
      padding: 7px 16px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 500;
      font-family: inherit;
      border: none;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-green { background: #2d6a4f; color: #e8f5ee; }
    .btn-green:hover:not(:disabled) { background: #3a8a66; }
    .btn-blue  { background: #1a3558; border: 1px solid #2a5080; color: #90b8e0; }
    .btn-blue:hover:not(:disabled) { background: #224470; }
    .btn-red   { background: #6b2737; color: #f5dde1; }
    .btn-red:hover:not(:disabled) { background: #8a3347; }
    .btn-ghost { background: none; border: 1px solid #2a2a2a; color: #666; }
    .btn-ghost:hover:not(:disabled) { border-color: #444; color: #888; }

    /* Stat cards */
    .stat-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 20px;
    }

    /* Approved box */
    .approved-box {
      margin-top: 16px;
      background: #0d1f14;
      border: 1px solid #2d6a4f;
      border-radius: 6px;
      padding: 16px;
    }
    .approved-box pre {
      font-size: 12px;
      color: #ccc;
      line-height: 1.65;
      white-space: pre-wrap;
      font-family: inherit;
      margin-top: 6px;
      padding: 10px;
      background: #111;
      border-radius: 4px;
      border: 1px solid #1f1f1f;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0f0f0f; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
  </style>
</head>
<body>
  <div style="max-width: 1100px; margin: 0 auto; padding: 0 28px;">

    <!-- Header -->
    <div style="padding-top: 22px;">
      <span style="font-size: 11px; letter-spacing: 0.14em; color: #444; text-transform: uppercase; font-variant: small-caps;">
        J. Rodney Dennis — Outreach Dashboard
      </span>
    </div>

    <!-- Tab bar -->
    <div style="display: flex; border-bottom: 1px solid #2a2a2a; margin-top: 18px;" id="tab-bar">
      <button class="tab-btn" data-tab="outreach">Outreach</button>
      <button class="tab-btn" data-tab="social">Social</button>
      <button class="tab-btn" data-tab="inbox">Inbox<span id="inbox-badge" style="display:none;margin-left:6px;width:7px;height:7px;border-radius:50%;background:#e05555;vertical-align:middle;position:relative;top:-1px;"></span></button>
      <button class="tab-btn" data-tab="stats">Stats</button>
    </div>

    <!-- Tab contents -->
    <div style="padding-top: 28px; padding-bottom: 60px;">
      <div id="tab-outreach"></div>

      <div id="tab-social" style="display: none;"></div>

      <div id="tab-inbox" style="display: none;"></div>

      <div id="tab-stats" style="display: none;"></div>
    </div>

  </div>

  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:8000'
      : 'https://jdennis-production.up.railway.app';

    // ── API helper ────────────────────────────────────────────────────────────
    async function api(path, opts = {}) {
      const res = await fetch(API_BASE + path, {
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`${res.status}: ${text}`);
      }
      return res.json();
    }

    // ── HTML escaping ─────────────────────────────────────────────────────────
    function esc(v) {
      return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escAttr(v) {
      return esc(v).replace(/"/g, '&quot;');
    }

    // ── Tab switching ─────────────────────────────────────────────────────────
    const TABS = ['outreach', 'social', 'inbox', 'stats'];

    function switchTab(name) {
      TABS.forEach(t => {
        document.getElementById('tab-' + t).style.display = t === name ? '' : 'none';
      });
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === name);
      });
      if (name === 'outreach') loadOutreach();
      if (name === 'social')   loadSocial();
      if (name === 'inbox')    loadInbox();
      if (name === 'stats')    loadStats();
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // ── Outreach tab ──────────────────────────────────────────────────────────
    async function loadOutreach() {
      const el = document.getElementById('tab-outreach');
      el.innerHTML = '<div style="color:#555;font-size:14px;padding:48px 0;">Loading…</div>';
      try {
        const drafts = await api('/api/v1/dashboard/pending-outreach');
        renderDrafts(drafts);
      } catch (e) {
        el.innerHTML = `<div style="color:#e05555;font-size:13px;padding:48px 0;">Error loading drafts: ${esc(e.message)}</div>`;
      }
    }

    function renderDrafts(drafts) {
      const el = document.getElementById('tab-outreach');
      if (!drafts.length) {
        el.innerHTML = '<div style="color:#555;font-size:14px;padding:48px 0;">No pending outreach.</div>';
        return;
      }
      const n = drafts.length;
      el.innerHTML =
        `<div id="pending-counter" style="color:#666;font-size:13px;margin-bottom:20px;">${n} email${n !== 1 ? 's' : ''} pending your approval</div>` +
        drafts.map(d => cardHTML(d)).join('');
    }

    function cardHTML(d) {
      const hasNotes = d.notes && d.notes.trim();
      return `
        <div class="card" id="card-${d.id}">
          <!-- Prospect header -->
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">
            <div>
              <span style="font-weight:600;font-size:15px;">${esc(d.prospect_name || '—')}</span>
              ${d.organization ? `<span style="color:#888;margin-left:9px;font-size:13px;">${esc(d.organization)}</span>` : ''}
            </div>
            <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;margin-left:12px;">
              ${d.country ? `<span style="color:#555;font-size:12px;">${esc(d.country)}</span>` : ''}
              ${d.category ? `<span style="font-size:10px;padding:2px 8px;border-radius:3px;background:#1f1f1f;color:#666;letter-spacing:0.06em;">${esc(d.category)}</span>` : ''}
            </div>
          </div>

          <!-- To line -->
          <div style="margin-bottom:10px;font-size:12px;">
            <span style="color:#444;letter-spacing:0.08em;text-transform:uppercase;font-size:10px;">To</span>
            <span style="color:#888;margin-left:8px;">${esc(d.email || '—')}</span>
          </div>

          <!-- Subject -->
          <div style="margin-bottom:10px;">
            <div class="field-label">Subject</div>
            <input id="subject-${d.id}" class="input-field" type="text" value="${escAttr(d.subject || '')}" />
          </div>

          <!-- Body -->
          <div style="margin-bottom:${hasNotes ? '10px' : '14px'};">
            <div class="field-label">Body</div>
            <textarea id="body-${d.id}" class="input-field" rows="9" style="resize:vertical;line-height:1.65;">${esc(d.body || '')}</textarea>
          </div>

          <!-- Research notes (collapsible) -->
          ${hasNotes ? `
            <div style="margin-bottom:14px;">
              <button class="btn btn-ghost" onclick="toggleNotes('${d.id}')" id="notes-btn-${d.id}" style="font-size:10px;">▼ Show research</button>
              <div id="notes-${d.id}" style="display:none;margin-top:8px;padding:10px 14px;background:#111;border:1px solid #1f1f1f;border-radius:5px;font-size:13px;color:#999;line-height:1.65;">
                ${esc(d.notes)}
              </div>
            </div>
          ` : ''}

          <!-- Action buttons -->
          <div id="actions-${d.id}" style="display:flex;gap:8px;">
            <button class="btn btn-green" id="approve-btn-${d.id}" onclick="approveOutreach('${d.id}')">Approve</button>
            <button class="btn btn-blue"  id="save-btn-${d.id}"    onclick="saveEdit('${d.id}')">Edit &amp; Save</button>
            <button class="btn btn-red"   id="reject-btn-${d.id}"  onclick="rejectOutreach('${d.id}')">Reject</button>
          </div>

          <!-- Approved copy-paste box (hidden until approved) -->
          <div id="approved-box-${d.id}" style="display:none;"></div>
        </div>
      `;
    }

    function toggleNotes(id) {
      const div = document.getElementById('notes-' + id);
      const btn = document.getElementById('notes-btn-' + id);
      const open = div.style.display !== 'none';
      div.style.display = open ? 'none' : 'block';
      btn.textContent = open ? '▼ Show research' : '▲ Hide research';
    }

    async function approveOutreach(id) {
      const btn = document.getElementById('approve-btn-' + id);
      btn.disabled = true;
      btn.textContent = '…';
      try {
        const result = await api(`/api/v1/dashboard/approve-outreach/${id}`, { method: 'POST' });

        // Hide action buttons
        document.getElementById('actions-' + id).style.display = 'none';

        // Read current (possibly edited) values from DOM
        const subject = document.getElementById('subject-' + id).value;
        const body    = document.getElementById('body-' + id).value;
        const email   = result.prospect_email;

        // Show ready-to-send box
        const box = document.getElementById('approved-box-' + id);
        box.innerHTML = `
          <div class="approved-box">
            <div style="color:#d4a847;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:14px;">
              ✓ Approved — open Gmail and send manually
            </div>
            <div style="margin-bottom:10px;">
              <div class="field-label">To</div>
              <div style="font-size:13px;color:#6fcf97;font-family:monospace;padding:6px 0;user-select:all;">${esc(email)}</div>
            </div>
            <div style="margin-bottom:10px;">
              <div class="field-label">Subject</div>
              <div style="font-size:13px;color:#f0ede8;padding:6px 0;user-select:all;">${esc(subject)}</div>
            </div>
            <div>
              <div class="field-label">Body</div>
              <pre style="user-select:all;">${esc(body)}</pre>
            </div>
          </div>
        `;
        box.style.display = 'block';

        // Make subject/body readonly now
        document.getElementById('subject-' + id).disabled = true;
        document.getElementById('body-' + id).disabled = true;

        decrementCounter();
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Approve';
        alert('Approve failed: ' + e.message);
      }
    }

    async function saveEdit(id) {
      const subject = document.getElementById('subject-' + id).value;
      const body    = document.getElementById('body-' + id).value;
      const btn     = document.getElementById('save-btn-' + id);
      btn.disabled  = true;
      btn.textContent = 'Saving…';
      try {
        await api(`/api/v1/dashboard/edit-outreach/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ subject, body }),
        });
        btn.textContent = 'Saved ✓';
        setTimeout(() => { btn.disabled = false; btn.textContent = 'Edit & Save'; }, 1800);
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Edit & Save';
        alert('Save failed: ' + e.message);
      }
    }

    async function rejectOutreach(id) {
      if (!confirm('Reject this draft?')) return;
      try {
        await api(`/api/v1/dashboard/reject-outreach/${id}`, { method: 'POST' });
        const card = document.getElementById('card-' + id);
        card.style.opacity = '0';
        card.style.transition = 'opacity 0.2s';
        setTimeout(() => card.remove(), 200);
        decrementCounter();
      } catch (e) {
        alert('Reject failed: ' + e.message);
      }
    }

    function decrementCounter() {
      const el = document.getElementById('pending-counter');
      if (!el) return;
      const m = el.textContent.match(/(\d+)/);
      if (!m) return;
      const n = parseInt(m[1]) - 1;
      el.textContent = n <= 0
        ? 'No pending outreach.'
        : `${n} email${n !== 1 ? 's' : ''} pending your approval`;
    }

    // ── Inbox tab ─────────────────────────────────────────────────────────────

    async function loadInbox() {
      const el = document.getElementById('tab-inbox');
      el.innerHTML = '<div style="color:#555;font-size:14px;padding:48px 0;">Loading…</div>';
      try {
        const msgs = await api('/api/v1/chat/pending');
        renderInbox(msgs);
        updateInboxBadge(msgs.length);
      } catch (e) {
        el.innerHTML = `<div style="color:#e05555;font-size:13px;padding:48px 0;">Error: ${esc(e.message)}</div>`;
      }
    }

    function updateInboxBadge(count) {
      const badge = document.getElementById('inbox-badge');
      if (!badge) return;
      badge.style.display = count > 0 ? 'inline-block' : 'none';
    }

    // Poll pending count on boot to show badge even before tab is opened
    async function checkInboxBadge() {
      try {
        const msgs = await api('/api/v1/chat/pending');
        updateInboxBadge(msgs.length);
      } catch (_) {}
    }

    function inboxChannelBadge(channel) {
      const colors = {
        email: '#1a3558', instagram: '#4a1a3a', website: '#1a3a1a',
        linkedin: '#1a2a4a', twitter: '#1a3a45', referral: '#3a2a1a',
      };
      const bg = colors[channel] || '#2a2a2a';
      return `<span style="font-size:10px;padding:2px 8px;border-radius:3px;background:${bg};color:#aaa;letter-spacing:0.06em;text-transform:uppercase;">${esc(channel)}</span>`;
    }

    function inboxCardHTML(msg) {
      const hp     = msg.high_priority === true || msg.high_priority === 'True';
      const ts     = msg.created_at ? new Date(msg.created_at).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
      const border = hp ? 'border-left:3px solid #e05555;' : '';
      const badge  = hp ? '<span style="font-size:9px;padding:2px 7px;border-radius:3px;background:#3a1010;color:#e05555;letter-spacing:0.12em;text-transform:uppercase;margin-left:10px;">HIGH PRIORITY</span>' : '';

      return `
        <div class="card" id="imcard-${msg.id}" style="margin-bottom:16px;${border}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
            <div>
              <span style="font-weight:600;font-size:15px;">${esc(msg.sender_name || '—')}</span>
              ${badge}
              <div style="color:#666;font-size:12px;margin-top:3px;">${esc(msg.sender_email || '')}</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;margin-left:12px;">
              ${inboxChannelBadge(msg.channel || 'email')}
              <span style="color:#444;font-size:11px;">${esc(ts)}</span>
            </div>
          </div>

          <div style="margin-bottom:14px;padding:12px 14px;background:#111;border:1px solid #1f1f1f;border-radius:5px;font-size:13px;color:#ccc;line-height:1.65;white-space:pre-wrap;">${esc(msg.message || '')}</div>

          <div style="margin-bottom:10px;">
            <div class="field-label" style="margin-bottom:6px;">AI Draft Response</div>
            <textarea id="imtext-${msg.id}" rows="7"
              style="display:block;width:100%;background:#111;border:1px solid #252525;border-radius:4px;padding:8px 11px;color:#f0ede8;font-size:13px;font-family:inherit;resize:vertical;line-height:1.65;"
            >${esc(msg.draft_response || '')}</textarea>
          </div>

          <div id="imactions-${msg.id}" style="display:flex;gap:8px;">
            <button class="btn btn-green" onclick="approveInboxMsg('${msg.id}', '${escAttr(msg.sender_email || '')}')">Approve &amp; Copy</button>
            <button class="btn btn-blue"  onclick="saveInboxDraft('${msg.id}')">Edit &amp; Save</button>
            <button class="btn btn-red"   onclick="deleteInboxMsg('${msg.id}')">Delete</button>
          </div>
          <div id="imapproved-${msg.id}" style="display:none;margin-top:8px;font-size:11px;color:#6fcf97;letter-spacing:0.08em;">
            Response approved and copied — send from Gmail to <span style="font-family:monospace;">${esc(msg.sender_email || '')}</span>
          </div>
        </div>
      `;
    }

    function renderInbox(msgs) {
      const el = document.getElementById('tab-inbox');

      const highPriority = msgs.filter(m => m.high_priority === true || m.high_priority === 'True');
      const banner = highPriority.length > 0 ? `
        <div style="background:#3a1010;border:1px solid #e05555;border-radius:6px;padding:12px 16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;">
          <span style="color:#e05555;font-size:13px;font-weight:500;">${highPriority.length} HIGH PRIORITY message${highPriority.length !== 1 ? 's' : ''} require immediate attention</span>
        </div>
      ` : '';

      const submitForm = `
        <div class="card" style="margin-top:40px;">
          <div class="field-label" style="margin-bottom:16px;">Log New Inbound Message</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
            <div>
              <div class="field-label" style="margin-bottom:6px;">Sender Name</div>
              <input id="im-name" class="input-field" type="text" placeholder="Full name" />
            </div>
            <div>
              <div class="field-label" style="margin-bottom:6px;">Sender Email</div>
              <input id="im-email" class="input-field" type="email" placeholder="email@example.com" />
            </div>
          </div>
          <div style="margin-bottom:12px;">
            <div class="field-label" style="margin-bottom:6px;">Channel</div>
            <select id="im-channel" class="input-field">
              <option value="email">Email</option>
              <option value="instagram">Instagram</option>
              <option value="website">Website</option>
              <option value="linkedin">LinkedIn</option>
              <option value="twitter">Twitter/X</option>
              <option value="referral">Referral</option>
            </select>
          </div>
          <div style="margin-bottom:16px;">
            <div class="field-label" style="margin-bottom:6px;">Message</div>
            <textarea id="im-message" class="input-field" rows="5" style="resize:vertical;" placeholder="Paste the full message here"></textarea>
          </div>
          <div style="display:flex;align-items:center;gap:14px;">
            <button class="btn btn-green" id="im-submit-btn" onclick="submitInbound()">Submit &amp; Generate Draft</button>
            <span id="im-submit-status" style="font-size:13px;color:#d4a847;"></span>
          </div>
        </div>
      `;

      if (!msgs.length) {
        el.innerHTML = `
          ${banner}
          <div style="color:#555;font-size:14px;padding:24px 0;">No pending messages.</div>
          ${submitForm}
        `;
        return;
      }

      el.innerHTML = `
        ${banner}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <div style="color:#666;font-size:13px;">${msgs.length} pending message${msgs.length !== 1 ? 's' : ''}</div>
          <button class="btn btn-ghost" onclick="loadInbox()">↻ Refresh</button>
        </div>
        ${msgs.map(m => inboxCardHTML(m)).join('')}
        ${submitForm}
      `;
    }

    async function approveInboxMsg(id, email) {
      try {
        const result = await api(`/api/v1/chat/${id}/approve-response`, { method: 'POST' });
        const text = result.draft_response || '';
        await navigator.clipboard.writeText(text).catch(() => {});
        document.getElementById('imactions-' + id).style.display = 'none';
        document.getElementById('imapproved-' + id).style.display = 'block';
        const ta = document.getElementById('imtext-' + id);
        if (ta) ta.disabled = true;
      } catch (e) { alert('Approve failed: ' + e.message); }
    }

    async function saveInboxDraft(id) {
      const ta = document.getElementById('imtext-' + id);
      if (!ta) return;
      try {
        await api(`/api/v1/chat/${id}/edit-response`, {
          method: 'PATCH',
          body: JSON.stringify({ draft_response: ta.value }),
        });
      } catch (e) { alert('Save failed: ' + e.message); }
    }

    async function deleteInboxMsg(id) {
      if (!confirm('Delete this message?')) return;
      try {
        await api(`/api/v1/chat/${id}`, { method: 'DELETE' });
        const card = document.getElementById('imcard-' + id);
        if (card) {
          card.style.opacity = '0';
          card.style.transition = 'opacity 0.2s';
          setTimeout(() => { card.remove(); }, 200);
        }
      } catch (e) { alert('Delete failed: ' + e.message); }
    }

    async function submitInbound() {
      const name    = document.getElementById('im-name').value.trim();
      const email   = document.getElementById('im-email').value.trim();
      const channel = document.getElementById('im-channel').value;
      const message = document.getElementById('im-message').value.trim();

      if (!name || !email || !message) { alert('Name, email, and message are required.'); return; }

      const btn    = document.getElementById('im-submit-btn');
      const status = document.getElementById('im-submit-status');
      btn.disabled = true;
      btn.textContent = 'Generating…';
      status.textContent = 'Calling Claude for a draft response…';

      try {
        const msg = await api('/api/v1/chat/inbound', {
          method: 'POST',
          body: JSON.stringify({ sender_name: name, sender_email: email, channel, message }),
        });
        status.textContent = 'Done — message and draft added above.';
        // Clear form
        ['im-name','im-email','im-message'].forEach(id => document.getElementById(id).value = '');
        // Reload list
        await loadInbox();
      } catch (e) {
        status.style.color = '#e05555';
        status.textContent = 'Error: ' + e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit & Generate Draft';
      }
    }

    // ── Social tab ────────────────────────────────────────────────────────────

    function socialTabHTML() {
      return `
        <div class="card">
          <div class="field-label" style="margin-bottom:16px;">Generate New Social Content</div>
          <div style="margin-bottom:14px;">
            <div class="field-label" style="margin-bottom:6px;">Trigger Event</div>
            <input id="social-trigger" class="input-field" type="text"
              placeholder="e.g. 2024 ARC Salon Chairman Choice Award" />
          </div>
          <div style="margin-bottom:14px;">
            <div class="field-label" style="margin-bottom:6px;">Context (optional)</div>
            <textarea id="social-context" class="input-field" rows="2" style="resize:vertical;"
              placeholder="e.g. just completed a 40x50 oil on linen depicting a Sunday congregation in Baltimore"></textarea>
          </div>
          <div style="margin-bottom:18px;">
            <div class="field-label" style="margin-bottom:8px;">Platforms</div>
            <div style="display:flex;gap:22px;">
              <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:#aaa;">
                <input type="checkbox" id="plat-linkedin" checked style="accent-color:#d4a847;" /> LinkedIn
              </label>
              <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:#aaa;">
                <input type="checkbox" id="plat-twitter" checked style="accent-color:#d4a847;" /> Twitter/X
              </label>
              <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:#aaa;">
                <input type="checkbox" id="plat-instagram" checked style="accent-color:#d4a847;" /> Instagram
              </label>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:14px;">
            <button class="btn btn-green" id="social-gen-btn" onclick="generateSocial()">Generate</button>
            <span id="social-gen-status" style="font-size:13px;color:#d4a847;"></span>
          </div>
        </div>

        <div id="social-generated"></div>

        <div style="margin-top:32px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <div style="font-size:10px;letter-spacing:0.12em;color:#555;text-transform:uppercase;">Pending Drafts</div>
            <button class="btn btn-ghost" onclick="loadSocialPending()">↻ Refresh</button>
          </div>
          <div id="social-pending"><div style="color:#555;font-size:13px;padding:24px 0;">Loading…</div></div>
        </div>
      `;
    }

    function socialDraftCardHTML(d, opts = {}) {
      const maxChars = d.platform === 'twitter' ? 280 : null;
      const labelMap = { linkedin: 'LinkedIn', twitter: 'Twitter / X', instagram: 'Instagram' };
      const label = labelMap[d.platform] || d.platform;
      const rows = d.platform === 'linkedin' ? 12 : d.platform === 'instagram' ? 7 : 4;
      const charInfo = maxChars
        ? `<span id="cc-${d.id}" style="font-size:11px;color:#555;">${(d.content || '').length} / ${maxChars}</span>`
        : `<span style="font-size:11px;color:#555;">${(d.content || '').length} chars</span>`;
      return `
        <div class="card" id="sdcard-${d.id}" style="margin-bottom:0;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div style="font-size:10px;letter-spacing:0.12em;color:#888;text-transform:uppercase;">${esc(label)}</div>
            ${opts.trigger ? `<div style="font-size:11px;color:#555;">${esc(d.trigger_event || '')}</div>` : ''}
          </div>
          <textarea id="sdtext-${d.id}" rows="${rows}" oninput="onSocialTextInput('${d.id}', ${maxChars || 'null'})"
            style="display:block;width:100%;background:#111;border:1px solid #252525;border-radius:4px;padding:8px 11px;color:#f0ede8;font-size:13px;font-family:inherit;resize:vertical;line-height:1.65;margin-bottom:8px;"
          >${esc(d.content || '')}</textarea>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            ${charInfo}
          </div>
          <div id="sdactions-${d.id}" style="display:flex;gap:8px;">
            <button class="btn btn-green" onclick="approveSocialDraft('${d.id}')">Approve</button>
            <button class="btn btn-blue"  onclick="saveSocialDraft('${d.id}')">Edit &amp; Save</button>
            <button class="btn btn-red"   onclick="deleteSocialDraft('${d.id}')">Delete</button>
          </div>
          <div id="sdapproved-${d.id}" style="display:none;font-size:11px;color:#d4a847;letter-spacing:0.08em;margin-top:6px;">
            Approved — copy text above and post manually
          </div>
        </div>
      `;
    }

    function onSocialTextInput(id, maxChars) {
      if (!maxChars) return;
      const ta = document.getElementById('sdtext-' + id);
      const cc = document.getElementById('cc-' + id);
      if (!ta || !cc) return;
      const n = ta.value.length;
      cc.textContent = `${n} / ${maxChars}`;
      cc.style.color = n > maxChars ? '#e05555' : '#555';
    }

    function loadSocial() {
      const el = document.getElementById('tab-social');
      el.innerHTML = socialTabHTML();
      loadSocialPending();
    }

    async function loadSocialPending() {
      const el = document.getElementById('social-pending');
      if (!el) return;
      el.innerHTML = '<div style="color:#555;font-size:13px;padding:16px 0;">Loading…</div>';
      try {
        const drafts = await api('/api/v1/social/pending');
        if (!drafts.length) {
          el.innerHTML = '<div style="color:#555;font-size:13px;padding:16px 0;">No pending drafts.</div>';
          return;
        }
        // Group by trigger_event, then platform order: linkedin, twitter, instagram
        const groups = {};
        drafts.forEach(d => {
          const key = d.trigger_event || 'Untitled';
          if (!groups[key]) groups[key] = [];
          groups[key].push(d);
        });
        const order = ['linkedin', 'twitter', 'instagram'];
        el.innerHTML = Object.entries(groups).map(([trigger, items]) => {
          const sorted = items.slice().sort((a, b) =>
            order.indexOf(a.platform) - order.indexOf(b.platform)
          );
          return `
            <div style="margin-bottom:28px;">
              <div style="font-size:10px;letter-spacing:0.12em;color:#555;text-transform:uppercase;margin-bottom:12px;">${esc(trigger)}</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;">
                ${sorted.map(d => socialDraftCardHTML(d, { trigger: false })).join('')}
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        el.innerHTML = `<div style="color:#e05555;font-size:13px;">Error: ${esc(e.message)}</div>`;
      }
    }

    async function generateSocial() {
      const trigger = document.getElementById('social-trigger').value.trim();
      if (!trigger) { alert('Enter a trigger event.'); return; }
      const context = document.getElementById('social-context').value.trim();
      const platforms = ['linkedin', 'twitter', 'instagram'].filter(p =>
        document.getElementById('plat-' + p)?.checked
      );
      if (!platforms.length) { alert('Select at least one platform.'); return; }

      const btn    = document.getElementById('social-gen-btn');
      const status = document.getElementById('social-gen-status');
      const genDiv = document.getElementById('social-generated');
      btn.disabled = true;
      btn.textContent = 'Generating…';
      status.textContent = 'Calling Claude, this takes ~15 seconds…';
      genDiv.innerHTML = '';

      try {
        const data = await api('/api/v1/social/generate', {
          method: 'POST',
          body: JSON.stringify({ trigger_event: trigger, context, platforms }),
        });
        const drafts = data.drafts || [];
        if (!drafts.length) {
          status.textContent = 'No drafts returned.';
        } else {
          status.textContent = `${drafts.length} draft${drafts.length !== 1 ? 's' : ''} generated`;
          const order = ['linkedin', 'twitter', 'instagram'];
          const sorted = drafts.slice().sort((a, b) =>
            order.indexOf(a.platform) - order.indexOf(b.platform)
          );
          genDiv.innerHTML = `
            <div style="margin:24px 0 8px;font-size:10px;letter-spacing:0.12em;color:#555;text-transform:uppercase;">Just Generated</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:8px;">
              ${sorted.map(d => socialDraftCardHTML(d, { trigger: false })).join('')}
            </div>
          `;
          // Scroll generated into view
          genDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      } catch (e) {
        status.style.color = '#e05555';
        status.textContent = 'Error: ' + e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate';
      }
    }

    async function approveSocialDraft(id) {
      try {
        await api(`/api/v1/social/${id}/approve`, { method: 'PATCH' });
        const actions  = document.getElementById('sdactions-' + id);
        const approved = document.getElementById('sdapproved-' + id);
        const ta       = document.getElementById('sdtext-' + id);
        if (actions)  actions.style.display = 'none';
        if (approved) approved.style.display = 'block';
        if (ta)       ta.disabled = true;
      } catch (e) { alert('Approve failed: ' + e.message); }
    }

    async function saveSocialDraft(id) {
      const ta = document.getElementById('sdtext-' + id);
      if (!ta) return;
      try {
        await api(`/api/v1/social/${id}/edit`, {
          method: 'PATCH',
          body: JSON.stringify({ content: ta.value }),
        });
      } catch (e) { alert('Save failed: ' + e.message); }
    }

    async function deleteSocialDraft(id) {
      if (!confirm('Delete this draft?')) return;
      try {
        await api(`/api/v1/social/${id}`, { method: 'DELETE' });
        const card = document.getElementById('sdcard-' + id);
        if (card) {
          card.style.opacity = '0';
          card.style.transition = 'opacity 0.2s';
          setTimeout(() => card.remove(), 200);
        }
      } catch (e) { alert('Delete failed: ' + e.message); }
    }

    // ── Stats tab ─────────────────────────────────────────────────────────────
    async function loadStats() {
      const el = document.getElementById('tab-stats');
      el.innerHTML = '<div style="color:#555;font-size:14px;padding:48px 0;">Loading…</div>';
      try {
        const [s, log] = await Promise.all([
          api('/api/v1/dashboard/stats'),
          api('/api/v1/dashboard/discovery-log').catch(() => []),
        ]);
        renderStats(s, log || []);
      } catch (e) {
        el.innerHTML = `<div style="color:#e05555;font-size:13px;padding:48px 0;">Error: ${esc(e.message)}</div>`;
      }
    }

    function renderDiscoveryLogTable(rows) {
      if (!rows || rows.length === 0) {
        return '<div style="color:#555;font-size:13px;">No discovery runs yet.</div>';
      }
      const headerCells = ['Date', 'Found', 'Added'].map(h =>
        `<th style="padding:10px 18px;text-align:left;color:#555;font-weight:500;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;">${h}</th>`
      ).join('');
      const bodyRows = rows.map((row, i) => {
        const border = i < rows.length - 1 ? 'border-bottom:1px solid #222;' : '';
        const date = row.run_at ? new Date(row.run_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '—';
        return `<tr style="${border}">
          <td style="padding:10px 18px;color:#aaa;">${esc(date)}</td>
          <td style="padding:10px 18px;color:#d4a847;">${row.prospects_found ?? 0}</td>
          <td style="padding:10px 18px;color:#d4a847;">${row.prospects_added ?? 0}</td>
        </tr>`;
      }).join('');
      return `<div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;overflow:hidden;">
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead><tr style="border-bottom:1px solid #2a2a2a;">${headerCells}</tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>`;
    }

    function renderStats(s, log) {
      const el = document.getElementById('tab-stats');
      const cards = [
        { label: 'Total Prospects',  value: s.total_prospects  ?? '—' },
        { label: 'Not Contacted',    value: s.not_contacted    ?? '—' },
        { label: 'Sent',             value: s.sent             ?? '—' },
        { label: 'Pending Drafts',   value: s.pending_drafts   ?? '—' },
        { label: 'Approved Drafts',  value: s.approved_drafts  ?? '—' },
        { label: 'Emails Available', value: s.emails_available ?? '—' },
      ];

      el.innerHTML = `
        <div style="display:flex;justify-content:flex-end;margin-bottom:24px;">
          <button class="btn btn-ghost" onclick="loadStats()">↻ Refresh</button>
        </div>

        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px;">
          ${cards.map(({ label, value }) => `
            <div class="stat-card">
              <div style="font-size:48px;font-weight:300;color:#d4a847;line-height:1;letter-spacing:-0.02em;">${value}</div>
              <div style="color:#555;font-size:11px;margin-top:10px;letter-spacing:0.08em;text-transform:uppercase;">${label}</div>
            </div>
          `).join('')}
        </div>

        <div class="card" style="margin-bottom:16px;">
          <div class="field-label" style="margin-bottom:16px;">Generate More Drafts</div>
          <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
            <div>
              <div class="field-label" style="margin-bottom:6px;">Country</div>
              <select id="pipeline-country" class="input-field">
                <option value="">All</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="France">France</option>
                <option value="UAE">UAE</option>
                <option value="Germany">Germany</option>
                <option value="South Africa">South Africa</option>
                <option value="Nigeria">Nigeria</option>
              </select>
            </div>
            <div>
              <div class="field-label" style="margin-bottom:6px;">Limit</div>
              <select id="pipeline-limit" class="input-field">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="25">25</option>
                <option value="50">50</option>
              </select>
            </div>
            <button class="btn btn-green" id="pipeline-btn" onclick="runPipeline()">Generate Drafts</button>
          </div>
          <div id="pipeline-result" style="margin-top:12px;font-size:13px;color:#d4a847;min-height:20px;"></div>
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <div class="field-label">Discovery Agent</div>
            <button class="btn btn-blue" id="discovery-btn" onclick="runDiscovery()">Run Discovery Now</button>
          </div>
          <div id="discovery-status" style="font-size:13px;color:#d4a847;min-height:20px;margin-bottom:12px;"></div>
          <div id="discovery-results" style="display:none;margin-bottom:20px;"></div>
          <div class="field-label" style="margin-bottom:12px;">Last 10 Runs</div>
          <div id="discovery-log-table">${renderDiscoveryLogTable(log)}</div>
        </div>
      `;
    }

    async function runPipeline() {
      const btn     = document.getElementById('pipeline-btn');
      const result  = document.getElementById('pipeline-result');
      const country = document.getElementById('pipeline-country').value;
      const limit   = parseInt(document.getElementById('pipeline-limit').value);

      btn.disabled = true;
      btn.textContent = 'Generating…';
      result.textContent = '';
      result.style.color = '#d4a847';

      try {
        const data = await api('/api/v1/dashboard/run-pipeline', {
          method: 'POST',
          body: JSON.stringify({ country: country || null, limit }),
        });
        result.textContent = `${data.new_drafts} new draft${data.new_drafts !== 1 ? 's' : ''} generated — switch to Outreach tab to review`;
      } catch (e) {
        result.style.color = '#e05555';
        result.textContent = 'Error: ' + e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate Drafts';
      }
    }

    async function runDiscovery() {
      const btn    = document.getElementById('discovery-btn');
      const status = document.getElementById('discovery-status');
      const results = document.getElementById('discovery-results');

      btn.disabled = true;
      btn.textContent = 'Searching…';
      status.textContent = 'Searching for new prospects…';
      status.style.color = '#d4a847';
      results.style.display = 'none';
      results.innerHTML = '';

      try {
        const data = await api('/api/v1/dashboard/run-discovery', { method: 'POST' });

        status.textContent = `Found ${data.prospects_found} prospects — ${data.prospects_added} new added.`;
        status.style.color = data.prospects_added > 0 ? '#6fcf97' : '#d4a847';

        if (data.new_prospects && data.new_prospects.length > 0) {
          results.innerHTML = `
            <div style="background:#111;border:1px solid #1f1f1f;border-radius:6px;padding:14px;margin-bottom:4px;">
              <div class="field-label" style="margin-bottom:10px;">New Prospects Added</div>
              ${data.new_prospects.map(p => `
                <div style="padding:7px 0;border-bottom:1px solid #1a1a1a;font-size:13px;">
                  <span style="color:#f0ede8;font-weight:500;">${esc(p.name)}</span>
                  <span style="color:#666;margin:0 6px;">·</span>
                  <span style="color:#888;">${esc(p.organization)}</span>
                  ${p.country ? `<span style="color:#555;font-size:11px;margin-left:8px;">${esc(p.country)}</span>` : ''}
                </div>
              `).join('')}
            </div>
          `;
          results.style.display = 'block';
        }

        // Refresh the log table
        const log = await api('/api/v1/dashboard/discovery-log').catch(() => []);
        const logEl = document.getElementById('discovery-log-table');
        if (logEl) logEl.innerHTML = renderDiscoveryLogTable(log || []);

      } catch (e) {
        status.style.color = '#e05555';
        status.textContent = 'Error: ' + e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Run Discovery Now';
      }
    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    switchTab('outreach');
    checkInboxBadge();
  </script>
</body>
</html>
